<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>不晚AI小说助手</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#12100e;--panel:#1a1714;--line:#302a24;--text:#efe6da;--muted:#a0937f;--dim:#6f6355;--gold:#d9a441;--gold2:#b57f2a;--ok:#5cc98b;--bad:#e5645b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1c1814,#151210);position:sticky;top:0;z-index:5}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,#d9a441,#8a5c1d);display:grid;place-items:center;font:700 15px/1 "Songti SC",serif;color:#2a1c07;letter-spacing:1px;flex:0 0 auto}
.brand b{display:block;font-size:15px;letter-spacing:.5px}
.brand small{color:var(--dim);font-size:11px}
.status{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
nav button.on{background:#2a241d;color:var(--gold);border-color:#3d342a}
main{flex:1;min-height:0;overflow:auto;padding:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.wrap{max-width:900px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:6px}
.hint{font-size:11.5px;color:var(--dim);line-height:1.7;margin:6px 0 0}
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:#211c17;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:8px 10px;font:inherit;font-size:13px;outline:none}
textarea{resize:vertical;line-height:1.75}
input:focus,select:focus,textarea:focus{border-color:#4a3f31}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button.btn{border:1px solid var(--line);background:#262019;color:var(--text);border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
button.btn:disabled{opacity:.4}
button.btn.primary{background:linear-gradient(180deg,#d9a441,#b57f2a);border-color:transparent;color:#2a1c07;font-weight:600}
button.btn.mini{padding:4px 9px;font-size:11.5px;border-radius:7px}
button.btn.jump{background:none;color:var(--gold);border-color:#4a3b26;font-size:11.5px;padding:4px 9px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#221d18;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:#5a4a2f;color:var(--gold);background:#2b2419}
.editor{width:100%;min-height:46vh;background:none;border:none;font-family:"Songti SC","Noto Serif SC",serif;font-size:16px;line-height:1.95;padding:0}
.bar{display:flex;gap:6px;flex-wrap:wrap;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(18,16,14,.2),var(--bg) 40%);padding:10px 0;margin-top:8px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;padding:7px 8px;border-radius:8px;font-size:12.5px;color:#d8cdbd;align-items:center}
.list li:nth-child(odd){background:#1f1a15}
.list li span{flex:1;min-width:0;word-break:break-all}
.list li button{border:none;background:none;color:#8a6a5a;cursor:pointer;font-size:12px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr}}
.help h4{margin:12px 0 4px;font-size:13px;color:var(--gold)}
.help p{margin:0 0 8px;font-size:12.5px;color:#cbbdab;line-height:1.8}
.help code{background:#241f19;padding:1px 5px;border-radius:4px;font-size:11.5px;color:#e0b96f}
.free{font-size:10px;color:#7be0a5;border:1px solid #2f5c45;border-radius:5px;padding:1px 5px;margin-left:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);background:#2a231c;border:1px solid #4a3f31;color:var(--text);padding:9px 14px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.18s;z-index:99;max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="logo">不晚</div>
  <div class="brand"><b>不晚AI小说助手</b><small>作者：不晚 · 本地与云端通用</small></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
</header>
<nav id="nav"></nav>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }</script>
</body>
</html>
